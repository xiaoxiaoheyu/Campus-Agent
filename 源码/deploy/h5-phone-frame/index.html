<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>校辩智生 · 手机版预览</title>
  <style>
    html, body { margin: 0; height: 100%; background: #eef1f5; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .phone { width: 414px; height: min(896px, calc(100vh - 72px)); background: #fff; border: 8px solid #1f2937; border-radius: 28px; box-sizing: border-box; overflow: hidden; box-shadow: 0 18px 50px rgba(15, 23, 42, 0.18); }
    .phone iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    .tip { font-size: 13px; color: #7a8794; }
    @media (max-width: 900px), (max-height: 700px) {
      .wrap { gap: 0; justify-content: flex-start; }
      .tip { display: none; }
      .phone { width: 100%; height: 100vh; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="phone">
      <iframe src="/index.html#/pages/index/index" title="校辩智生" allow="clipboard-write"></iframe>
    </div>
    <div class="tip">手机版预览 · 学生端</div>
  </div>
</body>
</html>
